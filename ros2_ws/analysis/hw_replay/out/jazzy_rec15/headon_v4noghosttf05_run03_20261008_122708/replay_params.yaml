controller_server:
  ros__parameters:
    odom_topic: odom
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    use_realtime_priority: false
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.0
      movement_time_allowance: 1000.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 120
      model_dt: 0.05
      batch_size: 1200
      ax_max: 3.0
      ax_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      vx_std: 0.25
      vy_std: 0.2
      wz_std: 0.7
      vx_max: 0.31
      vx_min: 0.0
      vy_max: 0.5
      wz_max: 1.5
      iteration_count: 1
      prune_distance: 2.8
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      motion_model: DiffDrive
      visualize: true
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics:
      - ConstraintCritic
      - ObstaclesCritic
      - SocialCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        critical_weight: 20.0
        repulsion_weight: 3.0
        collision_cost: 100000.0
        consider_footprint: true
        critical_cost: 300.0
      SocialCritic:
        topic: /predicted_person_positions
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        social_distance: 0.86
        group_aware: true
        narrow_social_distance: 0.6
        group_topic: /social_groups
        critical_distance: 0.35
        collision_cost: 800.0
        use_prediction: true
        prediction_weight: 0.5
        trajectory_point_step: 4
        track_timeout: 0.5
        max_coast_time: 6.0
        coast_weight: 1.0
        min_coast_speed: 0.15
        max_coast_speed: 2.5
        time_aware: true
        max_prediction_time: 6.0
        pass_side_weight: 12.0
        pass_side_margin: 0.85
        pass_side_max_offset: 0.95
        publish_markers: true
        publish_lane_block: true
        lane_block_width: 0.8
        lane_nearest_only: true
        lane_jump_reset: 1.5
        occlusion_slow_weight: 300.0
        occlusion_slow_speed: 0.15
        occlusion_slow_gap: 1.0
        occlusion_slow_after_s: 1.0
        lane_block_overlap: 0.45
        lane_block_robot_gap: 1.0
        lane_lateral_trust: 0.0
        pass_side_range: 12.0
        pass_side_min_closing: 0.3
        lane_on_first_sight_s: 1.5
        lane_first_sight_confirm_s: 0.5
        lane_first_sight_min_move: 0.25
        lane_ignore_beyond_goal: true
        lane_approach_window_s: 1.0
        lane_approach_min_move: 0.5
        lane_approach_consistency: 0.6
        side_ref_goal: true
        lane_beyond_goal_margin: 0.5
        pass_side_auto: true
        side_decision_s: 0.6
        side_switch_offset: 0.15
        side_ambiguous_offset: 0.0
        side_commit_offset: 0.06
        side_hold_offset: 0.3
        lane_carry_radius: 0.6
        lane_carry_along: 2.0
        no_retreat_weight: 300.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.25
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 6
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
    use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 7
      height: 7
      resolution: 0.06
      footprint: '[[ 0.189,  0.000], [ 0.134, -0.134], [ 0.000, -0.189], [-0.134,
        -0.134], [-0.189,  0.000], [-0.134,  0.134], [ 0.000,  0.189], [ 0.134,  0.134]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      always_send_full_costmap: true
      use_sim_time: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: LaserScan
          inf_is_valid: true
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.25
replay_lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
    - controller_server
    bond_timeout: 0.0
