# NVIDIA alternative to docker-compose.yaml (which is for Intel/Mesa graphics).
# Used to check that the thesis results reproduce on an NVIDIA machine.
# Needs the NVIDIA driver and the NVIDIA Container Toolkit on the host.
#   docker compose -f docker-compose.nvidia.yaml build
#   docker compose -f docker-compose.nvidia.yaml up -d
services:
  thesis_social_nav:
    build: .
    image: thesis-social-nav-jazzy
    container_name: thesis_social_nav
    network_mode: host
    privileged: true
    shm_size: "4gb"

    environment:
      DISPLAY: "${DISPLAY}"
      QT_X11_NO_MITSHM: "1"
      XDG_RUNTIME_DIR: /tmp/runtime-root
      ROS_DOMAIN_ID: "88"

      # NVIDIA graphics
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      __GLX_VENDOR_LIBRARY_NAME: nvidia
      LIBGL_ALWAYS_SOFTWARE: "0"

      # Gazebo Harmonic paths
      GZ_SIM_RESOURCE_PATH: /root/thesis_social_navigation_ws/simulation_models/worlds:/root/thesis_social_navigation_ws/simulation_models/temp_models:/root/thesis_social_navigation_ws/simulation_models:/opt/ros/jazzy/share
      GZ_SIM_SYSTEM_PLUGIN_PATH: /opt/ros/jazzy/lib

      # Shared libraries
      LD_LIBRARY_PATH: /opt/ros/jazzy/lib

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../ros2_ws:/root/thesis_social_navigation_ws
      - ~/.gz:/root/.gz
      - ~/.gz/fuel:/root/.gz/fuel

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    stdin_open: true
    tty: true
